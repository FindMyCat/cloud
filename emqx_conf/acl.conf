%% EMQX access control, mounted over /opt/emqx/etc/acl.conf. Rules are read
%% top to bottom; the first match wins.

%% The dashboard reads broker statistics.
{allow, {user, "dashboard"}, subscribe, ["$SYS/#"]}.

%% Tools run on the broker host itself may do anything.
{allow, {ipaddr, "127.0.0.1"}, pubsub, ["$SYS/#", "#"]}.

%% No FindMyCat device subscribes: the collar and the home station only
%% publish, and the rule engine reads messages without subscribing. Refusing
%% every remote subscription keeps anyone who connects from reading the topics.
{deny, all, subscribe, ["#"]}.

%% Publishing stays open until devices authenticate (allow_anonymous is still
%% true): the collar's MQTT-SN client has no credentials yet.
{allow, all, publish, ["#"]}.

{deny, all}.